name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12", "3.13"]

    steps:
      - uses: actions/checkout@v7

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}

      # ruff kommt exakt gepinnt aus dem `dev`-Extra in pyproject.toml. Kein
      # zweiter Pin-Schritt hier: Zwei Stellen fuer dieselbe Version driften
      # auseinander, und die CI merkt es nicht, weil sie sich selbst
      # ueberschreibt — lokal laeuft dann ein anderes Gate als hier.
      - name: Install dependencies
        run: |
          pip install -e ".[dev]"

      - name: Run tests
        run: |
          PYTHONPATH=src pytest tests/ -m "not live"

      # Der Pin wirkt nur, wenn `ruff` ihn auch aufruft: liegt frueher im
      # PATH ein anderes ruff, gewinnt jenes, und der Install meldet nichts.
      - name: Ruff-Pin (PATH und Modul gegen pyproject.toml)
        run: python scripts/check_ruff_pin.py

      - name: Lint
        run: ruff check src/ tests/ scripts/ docs/

      - name: Format check
        run: ruff format --check src/ tests/ scripts/ docs/

      - name: Versions-Sync (pyproject ↔ server.json / README / src)
        run: python scripts/check_version_sync.py

  lockfile:
    name: Verify uv.lock is in sync with pyproject.toml
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
        with:
          version: "0.8.x"
      - name: uv lock --locked
        run: uv lock --locked

  docker:
    name: Docker build
    runs-on: ubuntu-latest
    needs: [test, lockfile]
    # The GHA cache backend (`type=gha`) writes to the Actions cache and
    # therefore needs `actions: write`. The top-level
    # `permissions: contents: read` removes every other scope from
    # GITHUB_TOKEN, which makes build-push-action fail fast (~20s)
    # while initialising the cache exporter — the symptom we saw in PRs
    # #3, #11, #12, #13.
    permissions:
      contents: read
      actions: write
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - name: Build image
        uses: docker/build-push-action@v7
        with:
          context: .
          push: false
          load: true
          tags: register-mcp:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
          # Disable BuildKit attestations: not needed for a CI smoke
          # test, and they occasionally interact badly with `load: true`.
          provenance: false
          sbom: false
      - name: Smoke test — image refuses to start without MCP_API_KEY
        # Both HTTP transports: the image default (streamable-http) and SSE.
        run: |
          for t in "" sse; do
            set +e
            if [ -z "$t" ]; then
              out=$(docker run --rm register-mcp:ci 2>&1)
            else
              out=$(docker run --rm -e MCP_TRANSPORT="$t" register-mcp:ci 2>&1)
            fi
            rc=$?
            set -e
            echo "$out"
            if [ "$rc" -eq 0 ]; then
              echo "::error::Image (transport=${t:-default}) started without MCP_API_KEY"
              exit 1
            fi
            echo "$out" | grep -q "MCP_API_KEY" || {
              echo "::error::Expected MCP_API_KEY guidance in stderr (transport=${t:-default})"
              exit 1
            }
          done
      - name: Smoke test — a 2026-07-28 request reaches the running image
        # The unit suite drives the ASGI app in-process; this sends the same
        # request through uvicorn in the shipped image, under a non-localhost
        # Host header, as a reverse proxy would.
        run: |
          docker run -d --name smoke -p 8000:8000 -e MCP_API_KEY=smoke register-mcp:ci
          trap 'docker logs smoke; docker rm -f smoke >/dev/null' EXIT
          body='{"jsonrpc":"2.0","id":1,"method":"tools/list","params":{"_meta":{"io.modelcontextprotocol/protocolVersion":"2026-07-28","io.modelcontextprotocol/clientInfo":{"name":"ci","version":"0"},"io.modelcontextprotocol/clientCapabilities":{}}}}'
          for i in $(seq 1 30); do
            out=$(curl -sS http://127.0.0.1:8000/mcp \
              -H "Host: register-mcp.example.com" \
              -H "Authorization: Bearer smoke" \
              -H "Accept: application/json, text/event-stream" \
              -H "Content-Type: application/json" \
              -H "MCP-Protocol-Version: 2026-07-28" \
              -H "Mcp-Method: tools/list" \
              -d "$body" 2>/dev/null) && break
            sleep 1
          done
          echo "$out" | head -c 400; echo
          echo "$out" | python3 -c 'import json,sys; r=json.load(sys.stdin)["result"]; assert r["ttlMs"] > 0 and r["cacheScope"] == "public" and r["tools"], r'
      - name: Smoke test — non-root user
        run: |
          user=$(docker run --rm --entrypoint id register-mcp:ci -un)
          echo "User: $user"
          test "$user" = "mcp" || { echo "::error::Container is not running as user 'mcp'"; exit 1; }
