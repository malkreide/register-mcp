name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12", "3.13"]

    steps:
      - uses: actions/checkout@v6

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          pip install -e ".[dev]"

      - name: Run tests
        run: |
          PYTHONPATH=src pytest tests/ -m "not live"

      - name: Lint
        run: ruff check src/ tests/

  lockfile:
    name: Verify uv.lock is in sync with pyproject.toml
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: astral-sh/setup-uv@v3
        with:
          version: "0.5.x"
      - name: uv lock --locked
        run: uv lock --locked

  docker:
    name: Docker build
    runs-on: ubuntu-latest
    needs: [test, lockfile]
    steps:
      - uses: actions/checkout@v6
      - uses: docker/setup-buildx-action@v4
      - name: Build image
        uses: docker/build-push-action@v7
        with:
          context: .
          push: false
          load: true
          tags: register-mcp:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Smoke test — image refuses to start without MCP_API_KEY
        run: |
          set +e
          out=$(docker run --rm -e MCP_TRANSPORT=sse register-mcp:ci 2>&1)
          rc=$?
          echo "$out"
          if [ "$rc" -eq 0 ]; then
            echo "::error::Image started without MCP_API_KEY (should have exited non-zero)"
            exit 1
          fi
          echo "$out" | grep -q "MCP_API_KEY" || {
            echo "::error::Expected MCP_API_KEY guidance in stderr"
            exit 1
          }
      - name: Smoke test — non-root user
        run: |
          user=$(docker run --rm --entrypoint id register-mcp:ci -un)
          echo "User: $user"
          test "$user" = "mcp" || { echo "::error::Container is not running as user 'mcp'"; exit 1; }
