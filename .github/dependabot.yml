version: 2
updates:
  # `uv`, not `pip`: the pip ecosystem only rewrites pyproject.toml and leaves
  # uv.lock untouched, so every dependency PR failed the "Verify uv.lock is in
  # sync with pyproject.toml" job (PRs #26–#30). The uv ecosystem updates the
  # manifest and the lockfile in the same commit.
  - package-ecosystem: uv
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    labels: [dependencies, python]
    groups:
      python-minor-and-patch:
        update-types: [minor, patch]
    commit-message:
      prefix: deps
      include: scope

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    labels: [dependencies, ci]
    commit-message:
      prefix: ci
      include: scope

  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
    labels: [dependencies, docker]
    commit-message:
      prefix: docker
      include: scope
