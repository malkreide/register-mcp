# Lokales Gate, deckungsgleich mit dem Lint-Schritt in `.github/workflows/ci.yml`.
#
# `rev` traegt denselben Pin wie `pyproject.toml [dev]`: ruff 0.16.5. Das sind
# die beiden fuehrenden Stellen; die CI installiert kein eigenes ruff mehr,
# sondern nimmt es aus dem dev-Extra. Beide werden gemeinsam angehoben — laufen
# sie auseinander, meldet eine davon Abweichungen, die niemand verursacht hat,
# und `check_version_sync.py` bricht ab.
#
# `files` bildet den Umfang des Gates nach (`ruff … src/ tests/ scripts/ docs/`).
# `audits/` bleibt bewusst draussen: dort liegen datierte Protokolle, deren
# Python-Bloecke ein Formatter nicht umschreiben soll. Ein Hook, der Commits an
# Dateien aufhaelt, die kein Gate verlangt, wird abgeschaltet — und ein
# abgeschalteter Hook prueft nichts.
repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.16.5
    hooks:
      - id: ruff-check
        files: ^(src|tests|scripts|docs)/
      # Anders als die CI (`--check`) schreibt dieser Hook die Formatierung
      # direkt zurueck. Der Commit bricht ab, die Korrektur liegt danach im
      # Arbeitsverzeichnis und muss nur noch gestaged werden.
      #
      # `types_or` muss `markdown` mitfuehren. Der Hook bringt von Haus aus
      # `[python, pyi, jupyter]` mit — Markdown erreicht ihn damit nie, waehrend
      # `ruff format` in der CI die Python-Bloecke *in* `docs/*.md` sehr wohl
      # umschreibt. Ohne diese Zeile committet ein neuer ```python-Block in
      # einer Doku sauber durch und faellt erst im Gate. `files` grenzt weiter
      # auf den Gate-Umfang ein, `audits/` bleibt also aussen vor.
      - id: ruff-format
        files: ^(src|tests|scripts|docs)/
        types_or: [python, pyi, jupyter, markdown]
